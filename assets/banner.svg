<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accent" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><radialGradient id="glow1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".4"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".4"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></radialGradient><style>@keyframes float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(5deg)}}@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.15)}}@keyframes orbit{0%{transform:rotate(0deg) translateX(60px) rotate(0deg)}}.badge,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:54px;fill:#fff}.subtitle{font-weight:500;font-size:22px;fill:#cbd5e1}.badge{font-weight:600;font-size:14px;fill:#38bdf8;letter-spacing:2px}.atom1{animation:float 6s ease-in-out infinite;transform-origin:1000px 150px}.atom2{animation:float 8s ease-in-out infinite reverse;transform-origin:150px 200px}.glow-element{animation:pulse 4s ease-in-out infinite;transform-origin:center}</style></defs><rect width="1200" height="300" fill="url(#bg)" rx="16"/><circle cx="1000" cy="150" r="180" fill="url(#glow1)" class="glow-element"/><circle cx="150" cy="150" r="150" fill="url(#glow2)" class="glow-element"/><g class="atom1" opacity=".6"><line x1="950" x2="1050" y1="150" y2="90" stroke="#818cf8" stroke-dasharray="8 4" stroke-width="4"/><line x1="950" x2="1050" y1="150" y2="210" stroke="#818cf8" stroke-width="4"/><line x1="950" x2="870" y1="150" y2="150" stroke="#38bdf8" stroke-width="4"/><line x1="1050" x2="1120" y1="90" y2="130" stroke="#c084fc" stroke-width="4"/><circle cx="950" cy="150" r="22" fill="#38bdf8"/><circle cx="1050" cy="90" r="16" fill="#818cf8"/><circle cx="1050" cy="210" r="18" fill="#c084fc"/><circle cx="870" cy="150" r="14" fill="#34d399"/><circle cx="1120" cy="130" r="12" fill="#f43f5e"/></g><g class="atom2" opacity=".4"><line x1="100" x2="180" y1="80" y2="130" stroke="#38bdf8" stroke-width="3"/><line x1="180" x2="130" y1="130" y2="220" stroke="#818cf8" stroke-width="3"/><circle cx="100" cy="80" r="12" fill="#818cf8"/><circle cx="180" cy="130" r="16" fill="#38bdf8"/><circle cx="130" cy="220" r="10" fill="#c084fc"/></g><g transform="translate(100, 0)"><rect width="280" height="28" x="0" y="55" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" rx="14"/><text x="14" y="74" class="badge">CURATED ECOSYSTEM LIST</text><text x="0" y="140" class="title">Awesome Molecular Modeling 🧬</text><text x="0" y="185" class="subtitle">SaaS Platforms, Open-Source Libraries, MD Engines &amp; Computational Chemistry</text><rect width="460" height="5" x="0" y="215" fill="url(#accent)" rx="2.5"/></g></svg>